name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar ruff
        run: pip install ruff==0.16.4

      - name: Verificar estilo del codigo
        run: ruff check app/

  construir:
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen Docker
        run: docker build -t api-ia:ci .
